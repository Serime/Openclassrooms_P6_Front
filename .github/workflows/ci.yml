name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  REGISTRY: ghcr.io
  TEST_RESULTS_DIR: test-results

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    outputs:
      project-type: ${{ steps.detect.outputs.project-type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect project type
        id: detect
        run: echo "project-type=$(./run-tests.sh --detect)" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Type check (React)
        if: steps.detect.outputs.project-type == 'react'
        run: npx tsc

      - name: Type check (Node.js)
        if: steps.detect.outputs.project-type == 'node'
        run: npx tsc --noEmit -p tsconfig.build.json

      - name: Run tests
        run: ./run-tests.sh

      - name: Publish test report
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@v3
        with:
          name: Tests (${{ steps.detect.outputs.project-type }})
          path: ${{ env.TEST_RESULTS_DIR }}/junit.xml
          reporter: jest-junit
          fail-on-empty: true

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ steps.detect.outputs.project-type }}
          path: ${{ env.TEST_RESULTS_DIR }}/
          retention-days: 14

  build:
    name: Build image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Compute image name
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,prefix={{branch}}-,enable=${{ github.event_name != 'pull_request' }}
          labels: |
            org.opencontainers.image.description=${{ needs.test.outputs.project-type }} application

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        env:
          APP_IMAGE: ${{ fromJSON(steps.meta.outputs.json).tags[0] }}
        run: |
          docker compose up -d --no-build --wait --wait-timeout 120
          docker compose ps
          docker compose down -v

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push --all-tags "${{ steps.image.outputs.name }}"

  release:
    name: Release
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      - name: Log in to GitHub Container Registry
        if: steps.semantic.outputs.version != ''
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        if: steps.semantic.outputs.version != ''
        uses: docker/setup-buildx-action@v4

      - name: Tag image with release version
        if: steps.semantic.outputs.version != ''
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          VERSION: ${{ steps.semantic.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:latest" \
            "${IMAGE}:main-${GITHUB_SHA::7}"
          echo "Released ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
